name: Editor tooling
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm run package
      - run: python tools/check-vsix.py
      - name: Record VSIX SHA-256
        run: python -c "from hashlib import sha256; from pathlib import Path; p = Path('artifacts/tuprel-vscode-0.1.0.vsix'); p.with_name('SHA256SUMS').write_bytes((sha256(p.read_bytes()).hexdigest() + '  ' + p.name + chr(10)).encode('ascii'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuprel-vscode-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            artifacts/*.vsix
            artifacts/SHA256SUMS
          if-no-files-found: error
