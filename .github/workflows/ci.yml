name: Editor tooling
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm run package
      - run: python tools/check-vsix.py
      - name: Record VSIX SHA-256
        run: python -c "from hashlib import sha256; from pathlib import Path; p = Path('artifacts/tuprel-vscode-0.1.0.vsix'); p.with_name('SHA256SUMS').write_bytes((sha256(p.read_bytes()).hexdigest() + '  ' + p.name + chr(10)).encode('ascii'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuprel-vscode-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            artifacts/*.vsix
            artifacts/SHA256SUMS
          if-no-files-found: error

  extension-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tuprel/tuprel
          ref: 3436cc4f2d0ec227f7130ebd2c4650dba601e82b
          path: .official-server
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        id: jdk17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        id: jdk25
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        id: jdk11
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        id: jdk21
        with:
          distribution: temurin
          java-version: '21'
      - name: Build pinned official server
        working-directory: .official-server
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 3436cc4f2d0ec227f7130ebd2c4650dba601e82b
          ./gradlew :tuprel-language-server:installDist --no-daemon --dependency-verification strict
      - run: npm ci --ignore-scripts
      - run: npm run package
      - run: python tools/check-vsix.py
      - name: Run tests from the installed VSIX
        shell: bash
        env:
          JDK17: ${{ steps.jdk17.outputs.path }}
          JDK21: ${{ steps.jdk21.outputs.path }}
          JDK25: ${{ steps.jdk25.outputs.path }}
          JDK11: ${{ steps.jdk11.outputs.path }}
        run: |
          export TUPREL_TEST_SERVER_REVISION=3436cc4f2d0ec227f7130ebd2c4650dba601e82b
          export TUPREL_TEST_DISTRIBUTION="$RUNNER_TEMP/tuprel D2 installed server"
          cp -R .official-server/tuprel-language-server/build/install/tuprel-language-server "$TUPREL_TEST_DISTRIBUTION"
          versions='17 21 25'
          if [ "$RUNNER_OS" = macOS ]; then versions='21'; fi
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          export TUPREL_TEST_BAD_JAVA="$JDK11/bin/java$suffix"
          for version in $versions; do
            case "$version" in
              17) selected="$JDK17" ;;
              21) selected="$JDK21" ;;
              25) selected="$JDK25" ;;
            esac
            export TUPREL_TEST_JAVA="$selected/bin/java$suffix"
            export TUPREL_TEST_CELL="java$version"
            if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:host; else npm run test:host; fi
          done
      - name: Preserve JVM and process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-host-lts-${{ matrix.os }}
          path: artifacts/d2-*/
          if-no-files-found: error
